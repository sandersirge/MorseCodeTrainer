name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Fast feedback first: lint (seconds) -> tests (a minute) -> packaging (slowest).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: python -m pip install -r requirements/requirements-lint.txt

      - name: Ruff check (app, tests, scripts)
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; oldest and newest on Windows/macOS.
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - { os: windows-latest, python-version: '3.10' }
          - { os: windows-latest, python-version: '3.14' }
          - { os: macos-latest, python-version: '3.10' }
          - { os: macos-latest, python-version: '3.14' }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libsdl2-dev libsdl2-mixer-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-dev.txt

      - name: Smoke tests
        run: pytest -m smoke -q

      - name: Full test suite
        run: pytest -q

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/report.html
          retention-days: 30

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, os: windows, arch: x64, python-arch: x64 }
          - { runner: windows-latest, os: windows, arch: x86, python-arch: x86 }
          - { runner: ubuntu-22.04, os: linux, arch: x64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64 }
          - { runner: macos-latest, os: macos, arch: arm64 }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch || '' }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libsdl2-dev libsdl2-mixer-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-build.txt

      - name: Build application
        run: pyinstaller morsetrainer.spec

      - name: Verify build output (Unix)
        if: runner.os != 'Windows'
        run: ls -la dist/MorseCodeTrainer/

      - name: Verify build output (Windows)
        if: runner.os == 'Windows'
        run: Get-ChildItem dist/MorseCodeTrainer/

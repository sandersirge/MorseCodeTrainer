version: 2
updates:
  # requirements/*.txt and pyproject.toml carry the same ranges; each package is capped below
  # its next major version (ruff below its next minor), so a breaking release arrives as a PR.
  - package-ecosystem: pip
    directories: ["/", "/requirements"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The ranges already let pip install every compatible release, so only propose a change
    # when a new release falls outside them (not every patch that merely raises the minimum).
    versioning-strategy: increase-if-necessary
    groups:
      dev-tools:
        patterns: [hypothesis, pytest, pytest-html, ruff, pyinstaller]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
